services:
  dmarc-dashboard:
    build: .
    image: dmarc-dashboard:latest
    container_name: dmarc-dashboard
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - dmarc-data:/data
    environment:
      IMAP_HOST: "${IMAP_HOST}"
      IMAP_PORT: "${IMAP_PORT:-993}"
      IMAP_USER: "${IMAP_USER}"
      IMAP_PASS: "${IMAP_PASS}"
      IMAP_FOLDER: "${IMAP_FOLDER:-INBOX}"
      IMAP_PROCESSED_FOLDER: "${IMAP_PROCESSED_FOLDER:-Processed}"
      IMAP_USE_SSL: "${IMAP_USE_SSL:-true}"
      IMAP_STARTTLS: "${IMAP_STARTTLS:-false}"
      POLL_INTERVAL_SECONDS: "${POLL_INTERVAL_SECONDS:-300}"
      DB_BACKEND: "${DB_BACKEND:-sqlite}"
      OIDC_ENABLED: "${OIDC_ENABLED:-false}"
      OIDC_ISSUER: "${OIDC_ISSUER:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      OIDC_REDIRECT_URI: "${OIDC_REDIRECT_URI:-}"
      SESSION_SECRET: "${SESSION_SECRET:-}"
      SESSION_MAX_AGE: "${SESSION_MAX_AGE:-28800}"
volumes:
  dmarc-data:
