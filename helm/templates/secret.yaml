apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dmarc-dashboard.fullname" . }}-imap
  labels:
    app: {{ include "dmarc-dashboard.fullname" . }}
type: Opaque
stringData:
  password: {{ .Values.imap.password | quote }}
---
{{- if eq .Values.db.backend "postgres" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dmarc-dashboard.fullname" . }}-pg
  labels:
    app: {{ include "dmarc-dashboard.fullname" . }}
type: Opaque
stringData:
  password: {{ .Values.db.postgres.password | quote }}
{{- end }}
---
{{- if .Values.oidc.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dmarc-dashboard.fullname" . }}-oidc
  labels:
    app: {{ include "dmarc-dashboard.fullname" . }}
type: Opaque
stringData:
  clientSecret: {{ .Values.oidc.clientSecret | quote }}
  sessionSecret: {{ .Values.oidc.sessionSecret | default (randAlphaNum 32) | quote }}
{{- end }}
