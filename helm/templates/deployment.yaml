apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dmarc-dashboard.fullname" . }}
  labels:
    app: {{ include "dmarc-dashboard.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "dmarc-dashboard.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "dmarc-dashboard.fullname" . }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      containers:
        - name: dmarc-dashboard
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            # ── IMAP ──────────────────────────────────────────────────────
            - name: IMAP_HOST
              value: {{ .Values.imap.host | quote }}
            - name: IMAP_PORT
              value: {{ .Values.imap.port | quote }}
            - name: IMAP_USER
              value: {{ .Values.imap.user | quote }}
            - name: IMAP_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "dmarc-dashboard.fullname" . }}-imap
                  key: password
            - name: IMAP_FOLDER
              value: {{ .Values.imap.folder | quote }}
            - name: IMAP_PROCESSED_FOLDER
              value: {{ .Values.imap.processedFolder | quote }}
            - name: IMAP_USE_SSL
              value: {{ .Values.imap.useSSL | quote }}
            - name: POLL_INTERVAL_SECONDS
              value: {{ .Values.imap.pollIntervalSeconds | quote }}

            # ── Database ──────────────────────────────────────────────────
            - name: DB_BACKEND
              value: {{ .Values.db.backend | quote }}
            {{- if eq .Values.db.backend "sqlite" }}
            - name: DB_PATH
              value: {{ .Values.db.sqlite.path | quote }}
            {{- end }}
            {{- if eq .Values.db.backend "postgres" }}
            - name: PG_HOST
              value: {{ .Values.db.postgres.host | quote }}
            - name: PG_PORT
              value: {{ .Values.db.postgres.port | quote }}
            - name: PG_DB
              value: {{ .Values.db.postgres.database | quote }}
            - name: PG_USER
              value: {{ .Values.db.postgres.user | quote }}
            - name: PG_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "dmarc-dashboard.fullname" . }}-pg
                  key: password
            - name: PG_SSLMODE
              value: {{ .Values.db.postgres.sslmode | quote }}
            {{- end }}

            # ── OIDC ──────────────────────────────────────────────────────
            - name: OIDC_ENABLED
              value: {{ .Values.oidc.enabled | quote }}
            {{- if .Values.oidc.enabled }}
            - name: OIDC_ISSUER
              value: {{ .Values.oidc.issuer | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "dmarc-dashboard.fullname" . }}-oidc
                  key: clientSecret
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "dmarc-dashboard.fullname" . }}-oidc
                  key: sessionSecret
            - name: OIDC_REDIRECT_URI
              value: {{ .Values.oidc.redirectUri | quote }}
            - name: OIDC_SCOPES
              value: {{ .Values.oidc.scopes | quote }}
            - name: SESSION_MAX_AGE
              value: {{ .Values.oidc.sessionMaxAge | quote }}
            {{- end }}

          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "dmarc-dashboard.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
