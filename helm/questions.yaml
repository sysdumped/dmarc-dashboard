categories:
  - name: Immagine
  - name: Connessione IMAP
  - name: Database
  - name: Autenticazione OIDC
  - name: Ingress
  - name: Storage
  - name: Risorse

questions:

  - variable: image.repository
    label: "Repository immagine"
    type: string
    required: true
    group: "Immagine"
  - variable: image.tag
    label: "Tag immagine"
    type: string
    default: "latest"
    group: "Immagine"
  - variable: image.pullPolicy
    label: "Pull policy"
    type: enum
    options: ["IfNotPresent", "Always", "Never"]
    default: "IfNotPresent"
    group: "Immagine"

  - variable: imap.host
    label: "Server IMAP"
    type: string
    required: true
    group: "Connessione IMAP"
  - variable: imap.port
    label: "Porta IMAP"
    type: int
    default: 993
    group: "Connessione IMAP"
  - variable: imap.useSSL
    label: "Usa SSL/TLS (porta 993)"
    description: "Connessione SSL diretta. Disabilita se usi STARTTLS sulla porta 143."
    type: boolean
    default: true
    group: "Connessione IMAP"
  - variable: imap.starttls
    label: "Usa STARTTLS (porta 143)"
    description: "Upgrade TLS su connessione plain. Richiede useSSL=false e porta 143. Compatibile con Microsoft Exchange."
    type: boolean
    default: false
    group: "Connessione IMAP"
  - variable: imap.user
    label: "Indirizzo email / username"
    type: string
    required: true
    group: "Connessione IMAP"
  - variable: imap.password
    label: "Password IMAP"
    type: password
    required: true
    group: "Connessione IMAP"
  - variable: imap.folder
    label: "Cartella sorgente"
    type: string
    default: "INBOX"
    group: "Connessione IMAP"
  - variable: imap.processedFolder
    label: "Cartella messaggi processati"
    description: "Cartella root dove spostare le email dopo l'importazione. Creata automaticamente se non esiste."
    type: string
    default: "Processed"
    group: "Connessione IMAP"
  - variable: imap.pollIntervalSeconds
    label: "Intervallo polling (secondi)"
    type: int
    default: 300
    min: 60
    max: 3600
    group: "Connessione IMAP"

  - variable: db.backend
    label: "Backend database"
    type: enum
    options: ["sqlite", "postgres"]
    default: "sqlite"
    required: true
    group: "Database"
    show_subquestion_if: "postgres"
    subquestions:
      - variable: db.postgres.host
        label: "Host PostgreSQL"
        type: string
        required: true
      - variable: db.postgres.port
        label: "Porta"
        type: int
        default: 5432
      - variable: db.postgres.database
        label: "Nome database"
        type: string
        default: "dmarc"
      - variable: db.postgres.user
        label: "Utente"
        type: string
        default: "dmarc"
      - variable: db.postgres.password
        label: "Password"
        type: password
        required: true
      - variable: db.postgres.sslmode
        label: "SSL mode"
        type: enum
        options: ["disable", "allow", "prefer", "require", "verify-ca", "verify-full"]
        default: "prefer"

  - variable: oidc.enabled
    label: "Abilita autenticazione OIDC"
    type: boolean
    default: false
    group: "Autenticazione OIDC"
    show_subquestion_if: true
    subquestions:
      - variable: oidc.issuer
        label: "Issuer URL"
        description: "Es: https://auth.example.com/application/o/dmarc-dashboard/"
        type: string
        required: true
      - variable: oidc.clientId
        label: "Client ID"
        type: string
        required: true
      - variable: oidc.clientSecret
        label: "Client Secret"
        type: password
        required: true
      - variable: oidc.redirectUri
        label: "Redirect URI"
        description: "Es: https://dmarc.example.com/auth/callback"
        type: string
        required: true
      - variable: oidc.scopes
        label: "Scopes OIDC"
        type: string
        default: "openid profile email"
      - variable: oidc.sessionSecret
        label: "Session secret"
        description: "Chiave per firmare i cookie di sessione. Imposta un valore fisso per evitare logout al restart del pod."
        type: password
      - variable: oidc.sessionMaxAge
        label: "Durata sessione (secondi)"
        type: int
        default: 28800

  - variable: ingress.enabled
    label: "Abilita Ingress"
    type: boolean
    default: true
    group: "Ingress"
    show_subquestion_if: true
    subquestions:
      - variable: ingress.host
        label: "Hostname"
        type: hostname
        required: true
      - variable: ingress.className
        label: "Ingress class"
        type: string
        default: "nginx"
      - variable: ingress.tls
        label: "Abilita TLS"
        type: boolean
        default: true
      - variable: ingress.tlsSecret
        label: "Nome Secret TLS"
        type: string
        default: "dmarc-dashboard-tls"

  - variable: persistence.enabled
    label: "Abilita persistenza dati"
    type: boolean
    default: true
    group: "Storage"
    show_subquestion_if: true
    subquestions:
      - variable: persistence.storageClass
        label: "Storage class"
        type: storageclass
        default: "longhorn"
      - variable: persistence.size
        label: "Dimensione volume"
        type: string
        default: "2Gi"

  - variable: resources.requests.cpu
    label: "CPU request"
    type: string
    default: "100m"
    group: "Risorse"
  - variable: resources.requests.memory
    label: "Memory request"
    type: string
    default: "128Mi"
    group: "Risorse"
  - variable: resources.limits.cpu
    label: "CPU limit"
    type: string
    default: "500m"
    group: "Risorse"
  - variable: resources.limits.memory
    label: "Memory limit"
    type: string
    default: "512Mi"
    group: "Risorse"
