categories:
  - name: Immagine
  - name: Connessione IMAP
  - name: Database
  - name: Autenticazione OIDC
  - name: Ingress
  - name: Storage
  - name: Risorse

questions:

  # ── Immagine ──────────────────────────────────────────────────────────────
  - variable: image.repository
    label: "Repository immagine"
    description: "es. gitea.example.com/myorg/dmarc-dashboard"
    type: string
    required: true
    group: "Immagine"
  - variable: image.tag
    label: "Tag immagine"
    type: string
    default: "latest"
    required: true
    group: "Immagine"
  - variable: image.pullPolicy
    label: "Pull policy"
    type: enum
    options: ["IfNotPresent", "Always", "Never"]
    default: "IfNotPresent"
    group: "Immagine"

  # ── IMAP ──────────────────────────────────────────────────────────────────
  - variable: imap.host
    label: "Server IMAP"
    description: "Hostname o IP del server IMAP"
    type: string
    required: true
    group: "Connessione IMAP"
  - variable: imap.port
    label: "Porta IMAP"
    type: int
    default: 993
    group: "Connessione IMAP"
  - variable: imap.useSSL
    label: "Usa SSL/TLS"
    type: boolean
    default: true
    group: "Connessione IMAP"
  - variable: imap.user
    label: "Indirizzo email / username"
    type: string
    required: true
    group: "Connessione IMAP"
  - variable: imap.password
    label: "Password IMAP"
    type: password
    required: true
    group: "Connessione IMAP"
  - variable: imap.folder
    label: "Cartella sorgente"
    type: string
    default: "INBOX"
    group: "Connessione IMAP"
  - variable: imap.processedFolder
    label: "Cartella messaggi processati"
    description: "Cartella root (non sotto INBOX) dove spostare le email dopo l'importazione. Viene creata automaticamente."
    type: string
    default: "Processed"
    group: "Connessione IMAP"
  - variable: imap.pollIntervalSeconds
    label: "Intervallo polling (secondi)"
    type: int
    default: 300
    min: 60
    max: 3600
    group: "Connessione IMAP"

  # ── Database ──────────────────────────────────────────────────────────────
  - variable: db.backend
    label: "Backend database"
    description: "SQLite è zero-config. PostgreSQL consigliato per volumi elevati."
    type: enum
    options: ["sqlite", "postgres"]
    default: "sqlite"
    required: true
    group: "Database"
    show_subquestion_if: "postgres"
    subquestions:
      - variable: db.postgres.host
        label: "Host PostgreSQL"
        type: string
        required: true
      - variable: db.postgres.port
        label: "Porta"
        type: int
        default: 5432
      - variable: db.postgres.database
        label: "Nome database"
        type: string
        default: "dmarc"
      - variable: db.postgres.user
        label: "Utente"
        type: string
        default: "dmarc"
      - variable: db.postgres.password
        label: "Password"
        type: password
        required: true
      - variable: db.postgres.sslmode
        label: "SSL mode"
        type: enum
        options: ["disable", "allow", "prefer", "require", "verify-ca", "verify-full"]
        default: "prefer"

  # ── OIDC ──────────────────────────────────────────────────────────────────
  - variable: oidc.enabled
    label: "Abilita autenticazione OIDC"
    description: "Se abilitato, l'accesso alla dashboard richiede autenticazione tramite provider OIDC (Keycloak, Authentik, Dex, Google, ecc.)"
    type: boolean
    default: false
    group: "Autenticazione OIDC"
    show_subquestion_if: true
    subquestions:
      - variable: oidc.issuer
        label: "Issuer URL"
        description: "URL base del provider OIDC. Deve esporre /.well-known/openid-configuration. Es: https://keycloak.example.com/realms/myrealm"
        type: string
        required: true

      - variable: oidc.clientId
        label: "Client ID"
        description: "Client ID registrato nel provider OIDC"
        type: string
        required: true

      - variable: oidc.clientSecret
        label: "Client Secret"
        description: "Client Secret del provider OIDC. Verrà salvato in un Secret Kubernetes."
        type: password
        required: true

      - variable: oidc.redirectUri
        label: "Redirect URI"
        description: "Deve corrispondere esattamente a quanto registrato nel provider. Es: https://dmarc.example.com/auth/callback"
        type: string
        required: true

      - variable: oidc.scopes
        label: "Scopes OIDC"
        description: "Scopes richiesti al provider (separati da spazio)"
        type: string
        default: "openid profile email"

      - variable: oidc.sessionSecret
        label: "Session secret"
        description: "Chiave per firmare i cookie di sessione. Lascia vuoto per auto-generare (attenzione: le sessioni si invalidano al restart del pod)."
        type: password

      - variable: oidc.sessionMaxAge
        label: "Durata sessione (secondi)"
        description: "Dopo quanto tempo l'utente deve ri-autenticarsi"
        type: int
        default: 28800

  # ── Ingress ───────────────────────────────────────────────────────────────
  - variable: ingress.enabled
    label: "Abilita Ingress"
    type: boolean
    default: true
    group: "Ingress"
    show_subquestion_if: true
    subquestions:
      - variable: ingress.host
        label: "Hostname"
        description: "es. dmarc.example.com"
        type: hostname
        required: true
      - variable: ingress.className
        label: "Ingress class"
        type: string
        default: "nginx"
      - variable: ingress.tls
        label: "Abilita TLS"
        type: boolean
        default: true
      - variable: ingress.tlsSecret
        label: "Nome Secret TLS"
        type: string
        default: "dmarc-dashboard-tls"

  # ── Storage ───────────────────────────────────────────────────────────────
  - variable: persistence.enabled
    label: "Abilita persistenza dati"
    description: "Necessario se usi SQLite. Con PostgreSQL puoi disabilitarla."
    type: boolean
    default: true
    group: "Storage"
    show_subquestion_if: true
    subquestions:
      - variable: persistence.storageClass
        label: "Storage class"
        type: storageclass
        default: "longhorn"
      - variable: persistence.size
        label: "Dimensione volume"
        type: string
        default: "2Gi"

  # ── Risorse ───────────────────────────────────────────────────────────────
  - variable: resources.requests.cpu
    label: "CPU request"
    type: string
    default: "100m"
    group: "Risorse"
  - variable: resources.requests.memory
    label: "Memory request"
    type: string
    default: "128Mi"
    group: "Risorse"
  - variable: resources.limits.cpu
    label: "CPU limit"
    type: string
    default: "500m"
    group: "Risorse"
  - variable: resources.limits.memory
    label: "Memory limit"
    type: string
    default: "512Mi"
    group: "Risorse"
