replicaCount: 1

image:
  repository: "your-registry/dmarc-dashboard"
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: "nginx"
  host: "dmarc.example.com"
  tls: true
  tlsSecret: "dmarc-dashboard-tls"

imap:
  host: ""
  port: 993
  user: ""
  password: ""
  folder: "INBOX"
  processedFolder: "Processed"
  useSSL: true
  pollIntervalSeconds: 300

db:
  backend: "sqlite"
  sqlite:
    path: "/data/dmarc.db"
  postgres:
    host: ""
    port: 5432
    database: "dmarc"
    user: "dmarc"
    password: ""
    sslmode: "prefer"

# OIDC authentication
oidc:
  enabled: false
  issuer: ""           # es. https://keycloak.example.com/realms/myrealm
  clientId: ""
  clientSecret: ""
  redirectUri: ""      # es. https://dmarc.example.com/auth/callback
  scopes: "openid profile email"
  sessionSecret: ""    # lascia vuoto per auto-generare (non persistente tra restart)
  sessionMaxAge: 28800 # 8 ore in secondi

persistence:
  enabled: true
  storageClass: "longhorn"
  size: "2Gi"
  accessMode: ReadWriteOnce

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"
