replicaCount: 1
image:
  repository: "your-registry/dmarc-dashboard"
  tag: "latest"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8000
ingress:
  enabled: true
  className: "nginx"
  host: "dmarc.example.com"
  tls: true
  tlsSecret: "dmarc-dashboard-tls"
imap:
  host: ""
  port: 993
  user: ""
  password: ""
  folder: "INBOX"
  processedFolder: "Processed"
  useSSL: true
  pollIntervalSeconds: 300

# DB backend: "sqlite" o "postgres"
db:
  backend: "sqlite"
  sqlite:
    path: "/data/dmarc.db"
  postgres:
    host: ""
    port: 5432
    database: "dmarc"
    user: "dmarc"
    password: ""
    sslmode: "prefer"

persistence:
  enabled: true
  storageClass: "longhorn"
  size: "2Gi"
  accessMode: ReadWriteOnce
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"
